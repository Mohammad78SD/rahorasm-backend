name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system libraries (WeasyPrint needs Pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: rahorasm
        env:
          # Dummy values only; tests use sqlite and an in-memory cache.
          SECRET_KEY: ci-dummy-secret-key
          JWT: ci-dummy-jwt-key
          DB_NAME: unused
          DB_USER: unused
          DB_PASSWORD: unused
        run: pytest -q
